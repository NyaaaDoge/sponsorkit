name: Keep Alive

on:
  schedule:
    # Twice a month so the repo stays "active" well within GitHub's 60-day window
    - cron: '17 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep github actions alive"
          git push
